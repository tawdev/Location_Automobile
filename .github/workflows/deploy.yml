name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            set -e
            echo "Starting deployment..."
            cd /var/www/Location_Automobile
            
            # Reset local changes and get latest code
            git reset --hard
            # Remove generated sitemap/robots files that git pull would refuse to overwrite
            rm -f Front-end/public/robots.txt Front-end/public/sitemap-0.xml Front-end/public/sitemap.xml
            git pull origin main
            
            # --- Backend Laravel ---
            echo "Deploying Backend..."
            cd Back-End
            composer install --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Restart backend processes
            pm2 restart carforfar-api
            pm2 restart carforfar-queue
            
            # --- Frontend Next.js ---
            echo "Deploying Frontend..."
            cd ../Front-end
            npm install
            npm run build
            
            # Restart frontend process
            pm2 restart carforfar-frontend
            
            echo "Deployment completed successfully!"
