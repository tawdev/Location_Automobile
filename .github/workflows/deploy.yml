name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            set -e

            echo "Starting deployment..."
            cd /var/www/Location_Automobile

            # Reset local changes and remove untracked files, then pull latest code
            git reset --hard
            git clean -fd
            git pull origin main

            # --- Backend Laravel ---
            echo "Deploying Backend..."
            cd Back-End

            # Ensure .env exists (VPS must have it pre-configured with production DB creds)
            if [ ! -f .env ]; then
              echo "ERROR: .env not found! Create it from .env.example with production credentials."
              exit 1
            fi

            composer install --optimize-autoloader --no-dev

            # Run pending migrations (--force disables confirmation prompt)
            php artisan migrate --force 2>&1 || {
              echo "Migration had errors. Checking if partial migrations need registration..."
            }
            php artisan db:seed --class=PermissionSeeder --force

            # Cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Storage link for uploaded images
            php artisan storage:link || true

            # Permissions
            chmod -R 775 storage bootstrap/cache

            # Restart backend processes (bind to 0.0.0.0 so Nginx can proxy)
            pm2 restart carforfar-api || pm2 start php --name carforfar-api -- artisan serve --host=0.0.0.0 --port=8000
            pm2 restart carforfar-queue || pm2 start php --name carforfar-queue -- artisan queue:work

            # --- Nginx: proxy /api to Laravel ---
            echo "Configuring Nginx for API proxy..."
            set +e
            # Find the active Nginx site config
            NGINX_SITE=""
            for f in /etc/nginx/sites-enabled/*; do
              if [ -f "$f" ] && grep -q "server_name.*carforfar\|location / {" "$f" 2>/dev/null; then
                NGINX_SITE="$f"
                break
              fi
            done
            [ -z "$NGINX_SITE" ] && [ -f /etc/nginx/sites-enabled/default ] && NGINX_SITE=/etc/nginx/sites-enabled/default

            if [ -n "$NGINX_SITE" ] && ! grep -q "location /api/" "$NGINX_SITE" 2>/dev/null; then
              echo "Adding /api/ + /storage/ proxy to $NGINX_SITE"
              sudo python3 /var/www/Location_Automobile/Back-End/deploy/add_api_proxy.py "$NGINX_SITE"
              sudo nginx -t && sudo systemctl reload nginx || echo "Nginx config test failed"
            elif [ -z "$NGINX_SITE" ]; then
              echo "No Nginx site config found. Install nginx.conf manually."
            else
              echo "/api/ location already configured in Nginx"
            fi
            set -e

            # --- Frontend Next.js ---
            echo "Deploying Frontend..."
            cd ../Front-end

            if [ ! -f .env.local ]; then
              echo "ERROR: .env.local not found! Create it with NEXT_PUBLIC_API_BASE_URL."
              exit 1
            fi

            npm install
            npm run build

            # Restart frontend process
            pm2 restart carforfar-frontend || pm2 start npm --name carforfar-frontend -- start

            echo "Deployment completed successfully!"
