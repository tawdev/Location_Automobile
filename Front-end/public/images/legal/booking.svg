<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" rx="32" fill="url(#bg)"/>
  <rect width="500" height="500" rx="32" fill="url(#glow)"/>
  <circle cx="250" cy="220" r="90" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="250" y="245" text-anchor="middle" font-size="80">🚗</text>
  <rect x="150" y="360" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
