# /etc/nginx/sites-available/carforfar.com
# Symlink: ln -s /etc/nginx/sites-available/carforfar.com /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name carforfar.com www.carforfar.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name carforfar.com www.carforfar.com;

    # SSL (adjust paths to your actual certificate)
    ssl_certificate     /etc/ssl/certs/carforfar.com.pem;
    ssl_certificate_key /etc/ssl/private/carforfar.com.key;

    # Security
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Laravel API — proxy to PM2 (php artisan serve on :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Laravel storage (uploaded images)
    location /storage/ {
        alias /var/www/Location_Automobile/Back-End/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js front-end — proxy to PM2 (npm start on :3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
